name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: brew install python@3.13 ffmpeg
      - run: python3.13 -m venv .venv && .venv/bin/pip install --no-deps --require-hashes -r requirements.lock && .venv/bin/pip install pytest && .venv/bin/pip install --no-deps -e .
      - name: pytest
        shell: bash
        run: |
          set +e
          .venv/bin/python -m pytest -q -rf --tb=line 2>&1 | tee /tmp/pytest.txt
          rc=${PIPESTATUS[0]}
          grep -E "^(FAILED|ERROR)|Error|Fatal" /tmp/pytest.txt | head -15 | while read -r l; do echo "::error::${l:0:400}"; done
          exit $rc
      - name: Swift builds (no signing identity needed, ad-hoc)
        run: |
          OUT_DIR="$RUNNER_TEMP/app" app/build.sh
  formula:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: |
          brew tap-new local/ci
          F="$(brew --repository local/ci)/Formula/dop-call-recorder.rb"
          sed -e "s|@URL@|https://example.com/dop-call-recorder-1.0.0.tar.gz|" -e "s|@SHA256@|$(printf '0%.0s' {1..64})|" Formula/dop-call-recorder.rb > "$F"
          brew style local/ci/dop-call-recorder
